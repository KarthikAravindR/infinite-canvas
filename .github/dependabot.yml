version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # d3 is bundled into dist, so these updates ship to users. Dependabot cannot set a prefix per group: retitle the PR to "fix(deps): ..." before merging.
      d3:
        patterns: ["d3-*"]
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
