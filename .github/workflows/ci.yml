name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same version as the playwright devDependency.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    strategy:
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Use React 18
        if: matrix.react == 18
        run: npm install --no-save react@18 react-dom@18 # zizmor: ignore[adhoc-packages] the React 18 leg overrides the lockfile on purpose
      - run: npm run check

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(\([^()]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $re ]]; then
            exit 0
          fi
          echo "::error::The PR title must look like 'type(scope)!: summary', for example 'fix(zoom): clamp the scale'."
          printf 'Title was: %s\n' "$TITLE"
          exit 1

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
